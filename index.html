<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylish MP3 Music Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: linear-gradient(to right, #232526, #414345);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
      margin: 0; padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 400px;
      background: rgba(30,30,30,0.97);
      margin: 48px auto;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px #23252655;
    }
    h2, h3 { text-align: center; margin-bottom: 18px; }
    #folderInput {
      background: #333; color: #eee;
      border: none; padding: 9px 14px;
      border-radius: 6px;
      display: block; margin: 0 auto 20px auto;
      font-size: 16px;
    }
    #player {
      display: flex; flex-direction: column;
      align-items: center; margin-bottom: 16px;
    }
    audio { display: none; }
    .controls button {
      background: #3498db;
      border: none; color: #fff; font-size: 24px;
      margin: 0 11px; padding: 8px 12px;
      border-radius: 7px; cursor: pointer;
      box-shadow: 0 4px 14px #2223;
      transition: background 0.22s;
    }
    .controls button:active { background: #2980b9; }
    #playlist {
      list-style: none; padding: 0;
      margin: 10px 0 0 0; max-height: 160px; overflow-y: auto;
      border-radius: 10px;
      background: #2c3e50cc;
    }
    #playlist li {
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid #23252640;
      transition: background 0.18s;
    }
    #playlist li:last-child { border-bottom: none; }
    #playlist li:hover, #playlist li.active {
      background: #3498db22;
      color: #fff;
      font-weight: bold;
    }
