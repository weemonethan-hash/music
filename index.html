<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Folder MP3 Music Player</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#6ee7b7;
      --accent-2:#60a5fa;
      --muted:#9aa4b2;
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
      --radius: 12px;
      --control-size:44px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 20%, #081426 0%, transparent 20%),
                  radial-gradient(900px 400px at 90% 80%, #071324 0%, transparent 20%),
                  var(--bg);
      color:#e6eef6;
      padding:28px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:22px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .player{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .drop{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      border-radius:10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.01), transparent);
      border:1px dashed rgba(255,255,255,0.04);
      color:var(--muted);
      cursor:pointer;
      transition:all .18s ease;
    }

    .drop:hover{ transform: translateY(-3px); box-shadow: 0 12px 30px rgba(2,6,23,0.5); }
    .drop.dragover{ border-color: rgba(102, 126, 234, 0.6); color: #cfeff0; background: linear-gradient(90deg, rgba(102, 126, 234, 0.03), rgba(255,255,255,0.01)); }

    .drop .icon{
      width:56px; height:56px; border-radius:10px;
      display:grid; place-items:center;
      background:linear-gradient(135deg,#4654f5,#9be7c6);
      color:#072; font-weight:700;
      box-shadow: 0 6px 18px rgba(69,84,245,0.12);
      flex-shrink:0;
      font-size:14px;
    }

    .small{
      font-size:13px;
      color:var(--muted);
      margin-top:6px;
    }

    .cover{
      height:240px;
      border-radius:12px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.18)),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.01) 0 2px, transparent 2px 8px),
        #071229;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .cover .art{
      width:200px; height:200px; border-radius:6px; background:linear-gradient(135deg,#22366f,#1d6b7a); display:grid; place-items:center; color:#fff;
      font-size:20px; text-align:center; padding:10px;
    }

    .info{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .meta{ min-width:0; }
    .meta h4{ margin:0; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta p{ margin:0; font-size:13px; color:var(--muted); margin-top:4px; }

    .controls{
      display:flex; align-items:center; gap:10px; justify-content:space-between;
    }
    .ctrl-left, .ctrl-right{ display:flex; align-items:center; gap:8px; }

    /* icon buttons */
    .btn {
      width: var(--control-size);
      height: var(--control-size);
      display:grid;
      place-items:center;
      background:var(--glass);
      border:0;
      color:var(--muted);
      padding:8px;
      border-radius:10px;
      cursor:pointer;
      transition: all .14s ease;
    }
    .btn:hover{ transform: translateY(-4px); color:var(--accent); box-shadow: 0 10px 24px rgba(40,60,120,0.08); }

    .btn.play {
      width:56px; height:56px;
      border-radius:12px;
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#042;
      box-shadow: 0 10px 30px rgba(96,165,250,0.12);
    }

    /* seek */
    .seek{
      display:flex; align-items:center; gap:12px;
      margin-top:8px;
    }
    .progress{
      height:8px; background:var(--glass-2); flex:1; border-radius:99px; position:relative; cursor:pointer;
    }
    .progress .bar{
      height:100%; width:0%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); border-radius:inherit;
      transition: width .06s linear;
    }
    .time{ font-size:12px; color:var(--muted); width:56px; text-align:right; }

    /* volume */
    .volume{
      display:flex; align-items:center; gap:8px;
      align-self:flex-end;
      overflow:visible;
    }

    /* custom range styling (uses background fill via JS) */
    input[type=range]{
      -webkit-appearance:none; height:8px; background:transparent; width:140px; border-radius:6px; cursor:pointer;
    }
    input[type=range]:focus{ outline:none; }
    input[type=range]::-webkit-slider-runnable-track{ height:8px; background:transparent; border-radius:6px; }
    input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,#fff,#cfe7ff); margin-top:-4px; box-shadow:0 3px 10px rgba(2,6,23,0.5); cursor:pointer; }
    input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,#fff,#cfe7ff); box-shadow:0 3px 10px rgba(2,6,23,0.5); cursor:pointer; }
    input[type=range]::-moz-range-track{ height:8px; background:transparent; border-radius:6px; }

    .playlist{
      max-height:620px;
      overflow:auto;
      padding:10px;
      display:flex; flex-direction:column; gap:8px;
    }

    .track{
      display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; cursor:pointer; transition:all .12s ease;
      background:transparent; border:1px solid transparent;
    }
    .track:hover{ background: linear-gradient(90deg, rgba(255,255,255,0.012), rgba(255,255,255,0.01)); transform:translateY(-3px); }
    .track.active{ background: linear-gradient(90deg, rgba(102,126,234,0.06), rgba(110,231,183,0.03)); border-color: rgba(102,126,234,0.12); box-shadow:0 6px 20px rgba(34,56,165,0.06); }
    .track .num{ width:28px; text-align:center; color:var(--muted); }
    .track .name{ flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .track .dur{ color:var(--muted); font-size:13px; width:62px; text-align:right; }

    .help{ margin-top:8px; color:var(--muted); font-size:13px; }

    @media (max-width:980px){
      .wrap{ grid-template-columns: 1fr; padding:10px; }
      .cover{ height:200px }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card player">
      <div id="dropZone" class="drop" title="Click to choose folder or drop files/folders here">
        <div class="icon">MP3</div>
        <div>
          <div style="font-weight:600">Upload a folder of MP3s</div>
          <div class="small">Click or drop a folder. Files are read locally — nothing is uploaded.</div>
        </div>
        <input id="folderInput" type="file" webkitdirectory directory multiple accept=".mp3" style="display:none" />
      </div>

      <div class="cover card" aria-hidden="true">
        <div class="art" id="coverArt">—</div>
      </div>

      <div class="info">
        <div class="meta">
          <h4 id="trackTitle">—</h4>
          <p id="trackSub">No file loaded</p>
        </div>
        <div style="text-align:right; color:var(--muted); font-size:13px;">
          <div id="trackIndex">0 / 0</div>
        </div>
      </div>

      <div class="controls">
        <div class="ctrl-left">
          <button class="btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
            <!-- shuffle SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M3 6h2.586a4 4 0 0 1 2.828 1.172L12 11.757" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 6v6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 18h2.586a4 4 0 0 0 2.828-1.172L12 12.243" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 18v-6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="btn" id="prevBtn" aria-label="Previous" title="Previous">
            <!-- prev SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M6 6v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18 6L10 12l8 6V6z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="play" id="playPauseBtn" aria-label="Play / Pause" title="Play / Pause">
            <!-- play icon inserted/updated by JS -->
            <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M5 3v18l15-9L5 3z" fill="white"/>
            </svg>
          </button>

          <button class="btn" id="nextBtn" aria-label="Next" title="Next">
            <!-- next SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M18 6v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 6l8 6-8 6V6z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="btn" id="repeatBtn" aria-label="Repeat" title="Repeat">
            <!-- repeat SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M21 15v4h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 9V5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 5L14 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 19l7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="ctrl-right">
          <div class="volume">
            <button class="btn" id="muteBtn" aria-label="Mute / Unmute" title="Mute / Unmute">
              <!-- volume icon inserted/updated by JS -->
              <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
                <path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/>
                <path d="M19 8a4 4 0 010 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <input id="volumeRange" type="range" min="0" max="100" step="1" value="90" aria-label="Volume" />
          </div>
        </div>
      </div>

      <div class="seek">
        <div class="time" id="currentTime">0:00</div>
        <div class="progress" id="progressBar" title="Seek">
          <div class="bar" id="progressFill"></div>
        </div>
        <div class="time" id="durationTime">0:00</div>
      </div>

      <div class="help">Keyboard: Space play/pause · ←/→ prev/next · ↑/↓ volume · S shuffle · R repeat</div>

      <audio id="audio" preload="metadata" style="display:none"></audio>
    </div>

    <div class="card" style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div style="font-weight:700">Playlist</div>
        <div style="color:var(--muted); font-size:13px" id="folderName">No folder</div>
      </div>
      <div class="playlist" id="playlist"></div>
    </div>
  </div>

<script>
  // Elements
  const folderInput = document.getElementById('folderInput');
  const dropZone = document.getElementById('dropZone');
  const playlistEl = document.getElementById('playlist');
  const audio = document.getElementById('audio');
  const coverArt = document.getElementById('coverArt');
  const trackTitle = document.getElementById('trackTitle');
  const trackSub = document.getElementById('trackSub');
  const trackIndex = document.getElementById('trackIndex');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volumeRange = document.getElementById('volumeRange');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');
  const folderNameEl = document.getElementById('folderName');
  const volumeIcon = document.getElementById('volumeIcon');
  const playIcon = document.getElementById('playIcon');

  // State
  let tracks = [];
  let currentIndex = -1;
  let shuffle = false;
  let repeatMode = 0; // 0=off,1=all,2=one
  let order = [];
  let createdObjectURLs = [];
  let prevVolumeBeforeMute = parseInt(volumeRange.value, 10) || 90;

  // Helpers
  const fmt = s => {
    if (!isFinite(s) || s <= 0) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  };

  const bytesToSize = bytes => {
    if (bytes === 0) return '0 B';
    const k = 1024, sizes = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(bytes)/Math.log(k));
    return parseFloat((bytes/Math.pow(k,i)).toFixed(2)) + ' ' + sizes[i];
  };

  // Icon helpers
  function setPlayIcon(){
    playIcon.innerHTML = '<path d="M5 3v18l15-9L5 3z" fill="white"/>';
    playPauseBtn.title = 'Play';
    playPauseBtn.setAttribute('aria-pressed', 'false');
  }
  function setPauseIcon(){
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="white"/>';
    playPauseBtn.title = 'Pause';
    playPauseBtn.setAttribute('aria-pressed', 'true');
  }

  function setVolumeIconByValue(val){
    // val is 0..100
    const normalized = Number(val);
    if (audio.muted || normalized === 0) {
      volumeIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M19 8L15 12l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
      muteBtn.title = 'Unmute';
    } else if (normalized < 40) {
      volumeIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/>';
      muteBtn.title = 'Mute';
    } else {
      volumeIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M19 8a4 4 0 010 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
      muteBtn.title = 'Mute';
    }
  }

  // Volume range background fill update (keeps thumb visually within bounds)
  function updateRangeBackground(range){
    const val = (Number(range.value) - Number(range.min)) / (Number(range.max) - Number(range.min)) * 100;
    range.style.background = `linear-gradient(90deg, var(--accent-2) ${val}%, var(--glass-2) ${val}%)`;
  }

  // UI interactions
  dropZone.addEventListener('click', ()=> folderInput.click());
  folderInput.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

  ['dragenter','dragover'].forEach(ev => {
    dropZone.addEventListener(ev, (e)=>{ e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(ev => {
    dropZone.addEventListener(ev, (e)=>{ e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover'); });
  });
  dropZone.addEventListener('drop', e => {
    const items = Array.from(e.dataTransfer.files || []);
    if (items.length) handleFiles(items);
  });

  function handleFiles(fileList){
    createdObjectURLs.forEach(u => URL.revokeObjectURL(u));
    createdObjectURLs = [];
    tracks = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.mp3'));
    if (!tracks.length) {
      alert('No mp3 files found in selection.');
      return;
    }
    tracks.sort((a,b)=> a.name.localeCompare(b.name, undefined, {sensitivity:'base', numeric:true}));
    tracks = tracks.map(f => ({ file: f, name: f.name, url: null, duration: null, size: f.size }));
    folderNameEl.textContent = deriveFolderName(fileList);
    playlistEl.innerHTML = '';
    currentIndex = -1;
    loadDurationsSequential(tracks).then(() => {
      renderPlaylist();
      playTrack(0);
    });
  }

  function deriveFolderName(files){
    if (!files.length) return 'No folder';
    try {
      const p = files[0].webkitRelativePath || files[0].name;
      if (p.includes('/')) {
        const seg = p.split('/');
        return seg.slice(0, -1).join('/') || 'Folder';
      }
    } catch(e){}
    return 'Folder';
  }

  function loadDurationsSequential(arr){
    let i = 0;
    return new Promise((resolve) => {
      (function next(){
        if (i >= arr.length) return resolve();
        const item = arr[i];
        const a = document.createElement('audio');
        const u = URL.createObjectURL(item.file);
        createdObjectURLs.push(u);
        a.preload = 'metadata';
        a.src = u;
        a.addEventListener('loadedmetadata', ()=> {
          item.duration = a.duration;
          URL.revokeObjectURL(a.src);
          i++; next();
        }, {once:true});
        a.addEventListener('error', ()=> {
          item.duration = NaN;
          URL.revokeObjectURL(a.src);
          i++; next();
        }, {once:true});
      })();
    });
  }

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    tracks.forEach((t, idx) => {
      const el = document.createElement('div');
      el.className = 'track';
      el.dataset.idx = idx;
      el.innerHTML = `
        <div class="num">${String(idx+1).padStart(2,'0')}</div>
        <div class="name" title="${t.name}">${t.name}</div>
        <div class="dur">${isFinite(t.duration) ? fmt(t.duration) : bytesToSize(t.size)}</div>
      `;
      el.addEventListener('click', ()=> playTrack(idx));
      playlistEl.appendChild(el);
    });
    updateActiveInPlaylist();
  }

  function playTrack(idx){
    if (!tracks.length) return;
    if (idx < 0 || idx >= tracks.length) return;
    currentIndex = idx;
    if (audio.src) {
      try{ URL.revokeObjectURL(audio.src); } catch(e){}
    }
    const track = tracks[currentIndex];
    const url = URL.createObjectURL(track.file);
    createdObjectURLs.push(url);
    track.url = url;
    audio.src = url;
    audio.play().catch(()=>{});
    updateNowPlaying();
    updateActiveInPlaylist();
  }

  function updateNowPlaying(){
    if (currentIndex < 0 || currentIndex >= tracks.length) {
      trackTitle.textContent = '—';
      trackSub.textContent = 'No file loaded';
      trackIndex.textContent = `0 / ${tracks.length}`;
      coverArt.textContent = '—';
      durationTimeEl.textContent = '0:00';
      currentTimeEl.textContent = '0:00';
      return;
    }
    const t = tracks[currentIndex];
    trackTitle.textContent = t.name;
    trackSub.textContent = `${bytesToSize(t.size)}${isFinite(t.duration) ? ' • ' + fmt(t.duration) : ''}`;
    trackIndex.textContent = `${currentIndex+1} / ${tracks.length}`;
    coverArt.textContent = (t.name.split(/\s|[-_.]/).slice(0,4).map(s => s[0]||'').join('') || '♪').toUpperCase();
    durationTimeEl.textContent = isFinite(t.duration) ? fmt(t.duration) : '0:00';
    setPauseIcon();
  }

  function updateActiveInPlaylist(){
    Array.from(playlistEl.children).forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex);
    });
  }

  // Controls
  playPauseBtn.addEventListener('click', ()=> {
    if (audio.paused) { audio.play(); setPauseIcon(); }
    else { audio.pause(); setPlayIcon(); }
  });
  prevBtn.addEventListener('click', ()=> playPrevious());
  nextBtn.addEventListener('click', ()=> playNext());

  shuffleBtn.addEventListener('click', ()=> {
    shuffle = !shuffle;
    shuffleBtn.style.color = shuffle ? 'var(--accent)' : '';
    if (shuffle) generateShuffleOrder();
  });

  repeatBtn.addEventListener('click', ()=> {
    repeatMode = (repeatMode + 1) % 3;
    const labels = ['off','all','one'];
    repeatBtn.title = `Repeat: ${labels[repeatMode]}`;
    repeatBtn.style.color = repeatMode ? 'var(--accent)' : '';
  });

  muteBtn.addEventListener('click', ()=> {
    if (!audio.muted) {
      prevVolumeBeforeMute = Number(volumeRange.value);
      audio.muted = true;
      volumeRange.value = 0;
      updateRangeBackground(volumeRange);
      setVolumeIconByValue(0);
    } else {
      audio.muted = false;
      const restore = prevVolumeBeforeMute || 90;
      volumeRange.value = restore;
      audio.volume = restore / 100;
      updateRangeBackground(volumeRange);
      setVolumeIconByValue(restore);
    }
  });

  // volume range uses 0..100 to avoid tiny floating problems and to keep keyboard steps integer
  volumeRange.addEventListener('input', e => {
    const val = Number(e.target.value);
    audio.volume = val / 100;
    audio.muted = val === 0;
    if (!audio.muted) prevVolumeBeforeMute = val;
    updateRangeBackground(volumeRange);
    setVolumeIconByValue(val);
  });

  // initialize volume UI
  audio.volume = Number(volumeRange.value) / 100;
  updateRangeBackground(volumeRange);
  setVolumeIconByValue(volumeRange.value);

  // Audio events
  audio.addEventListener('timeupdate', ()=> {
    const cur = audio.currentTime;
    const dur = audio.duration || 0;
    const pct = dur ? (cur/dur)*100 : 0;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = fmt(cur);
    durationTimeEl.textContent = isFinite(dur) ? fmt(dur) : durationTimeEl.textContent;
  });

  audio.addEventListener('ended', ()=> {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      audio.play();
      return;
    }
    playNext();
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pct = Math.min(Math.max(0, x / rect.width), 1);
    if (audio.duration) audio.currentTime = pct * audio.duration;
  });

  function generateShuffleOrder(){
    order = Array.from(tracks.keys());
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    if (currentIndex >= 0) {
      const pos = order.indexOf(currentIndex);
      if (pos > -1) order.splice(pos,1), order.unshift(currentIndex);
    }
  }

  function playNext(){
    if (!tracks.length) return;
    if (shuffle) {
      if (!order.length) generateShuffleOrder();
      let pos = order.indexOf(currentIndex);
      pos = pos === -1 ? 0 : pos + 1;
      if (pos >= order.length) {
        if (repeatMode === 1) pos = 0;
        else return;
      }
      playTrack(order[pos]);
      return;
    }
    let nxt = currentIndex + 1;
    if (nxt >= tracks.length) {
      if (repeatMode === 1) nxt = 0;
      else return;
    }
    playTrack(nxt);
  }

  function playPrevious(){
    if (!tracks.length) return;
    if (shuffle && order.length) {
      let pos = order.indexOf(currentIndex);
      pos = pos === -1 ? 0 : pos - 1;
      if (pos < 0) {
        if (repeatMode === 1) pos = order.length - 1;
        else return;
      }
      playTrack(order[pos]);
      return;
    }
    let prev = currentIndex - 1;
    if (prev < 0) {
      if (repeatMode === 1) prev = tracks.length - 1;
      else return;
    }
    playTrack(prev);
  }

  // Keyboard shortcuts (arrow up/down adjusts by 5)
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playPauseBtn.click(); }
    if (e.code === 'ArrowRight') { e.preventDefault(); nextBtn.click(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); prevBtn.click(); }
    if (e.code === 'ArrowUp') {
      e.preventDefault();
      const v = Math.min(100, Number(volumeRange.value) + 5);
      volumeRange.value = v;
      volumeRange.dispatchEvent(new Event('input'));
    }
    if (e.code === 'ArrowDown') {
      e.preventDefault();
      const v = Math.max(0, Number(volumeRange.value) - 5);
      volumeRange.value = v;
      volumeRange.dispatchEvent(new Event('input'));
    }
    if (e.key.toLowerCase() === 's') { shuffleBtn.click(); }
    if (e.key.toLowerCase() === 'r') { repeatBtn.click(); }
  });

  // Cleanup
  window.addEventListener('beforeunload', ()=> {
    createdObjectURLs.forEach(u => {
      try{ URL.revokeObjectURL(u); } catch(e){}
    });
  });

  audio.addEventListener('play', ()=> setPauseIcon());
  audio.addEventListener('pause', ()=> setPlayIcon());
</script>
</body>
</html>
